name: Repair ticket syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'InochiNoYume'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair missing parenthesis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/commands/ticket/ticket.ts')
          text = p.read_text()
          old = '.addChannelTypes(ChannelType.GuildText).setRequired(true))));'
          new = '.addChannelTypes(ChannelType.GuildText).setRequired(true)))));'
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate repaired project
        run: |
          npm ci
          npm run check
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commands/ticket/ticket.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(tickets): close panel subcommand group'
          git push
